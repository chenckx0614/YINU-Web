<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="一隅的网页记录空间，与 Android 客户端同步。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https:; img-src 'self' data: blob:; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>一隅 · 网页版</title>
  <link rel="icon" href="./icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css?v=5">
  <script type="module" src="./app.js?v=6"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-record" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-5 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.5 1.1 6.3-5.5-3-5.5 3 1.1-6.3L3 9.6l6.3-.8L12 3Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 8a7.5 7.5 0 0 1 12.7-2L20 8m-16 8 1.7 2A7.5 7.5 0 0 0 18.4 16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.5 18a4.5 4.5 0 0 1-.8-8.9 6.2 6.2 0 0 1 11.8.7A4.1 4.1 0 0 1 18 18Z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3 10l7 3.7L14 21l7-18ZM21 3 10 13.7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6Zm8 0v6h5M9 13h7m-7 4h7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15m-6-6 6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <img src="./icon.png" width="45" height="45" alt="">
        <div><span class="brand-name">一隅</span><span class="brand-sub">网页版</span></div>
      </div>
      <nav class="navigation" aria-label="记录分类">
        <button type="button" class="nav-item active" data-filter="all" aria-pressed="true">
          <svg class="icon"><use href="#i-record"/></svg><span>时间线</span>
        </button>
        <button type="button" class="nav-item" data-filter="favorites" aria-pressed="false">
          <svg class="icon"><use href="#i-star"/></svg><span>收藏</span>
        </button>
        <button type="button" class="nav-item" data-filter="files" aria-pressed="false">
          <svg class="icon"><use href="#i-folder"/></svg><span>附件</span>
        </button>
      </nav>
      <button id="account" type="button" class="account">
        <span class="account-icon"><svg class="icon"><use href="#i-cloud"/></svg></span>
        <span class="account-label"><strong id="account-title">连接同步</strong><small id="account-detail">Supabase 账号</small></span>
        <svg class="icon chevron"><use href="#i-chevron"/></svg>
      </button>
    </aside>

    <main class="workspace">
      <header class="top-bar">
        <div class="top-inner">
          <div class="page-heading">
            <img class="mobile-logo" src="./icon.png" width="37" height="37" alt="一隅">
            <h1 id="page-title">时间线</h1>
          </div>
          <div class="tools">
            <label class="search">
              <svg class="icon"><use href="#i-search"/></svg>
              <input id="search" type="search" placeholder="搜索正文、文件名" aria-label="搜索正文、文件名">
            </label>
            <button class="sync-button" id="sync" type="button">
              <svg class="icon"><use href="#i-sync"/></svg><span id="sync-label">连接同步</span>
            </button>
            <button type="button" id="settings-open" class="round-button" aria-label="设置"><svg class="icon"><use href="#i-settings"/></svg></button>
          </div>
        </div>
        <div class="record-filters">
          <label>日期 <input type="date" id="filter-date" aria-label="按日期筛选"></label>
          <select id="filter-kind" aria-label="记录类型">
            <option value="">所有类型</option><option value="image">图片</option><option value="doc">文档</option>
            <option value="video">视频</option><option value="audio">语音与音乐</option>
            <option value="archive">压缩包</option><option value="apk">安装包</option>
            <option value="link">链接</option><option value="text">文字</option>
          </select>
          <select id="filter-group" aria-label="收藏分组" hidden></select>
          <button type="button" class="text-button" id="clear-filters" hidden>清除</button>
          <button type="button" class="text-button" id="selection-start">多选</button>
        </div>
        <div class="pin-bar" id="pin-bar" hidden></div>
      </header>

      <div class="scroll" id="scroll">
        <section class="stream" aria-label="记录列表">
          <div class="example" id="example">
            <svg class="icon"><use href="#i-cloud"/></svg>
            <p>当前记录保存在此浏览器</p>
            <button type="button" id="connect">连接我的记录 <svg class="icon"><use href="#i-chevron"/></svg></button>
          </div>
          <div id="records"></div>
        </section>
      </div>

      <div class="bottom">
        <div class="bottom-inner">
          <button type="button" class="latest" id="latest" aria-label="回到最新记录" title="回到最新记录" hidden>
            <svg class="icon"><use href="#i-down"/></svg>
          </button>
          <div class="selection-bar" id="selection-bar" hidden>
            <strong id="selection-count"></strong>
            <button class="text-button" id="selection-all" type="button">全选</button>
            <button class="text-button" id="selection-merge" type="button">合并</button>
            <button class="text-button" id="selection-export" type="button">导出长图</button>
            <button class="text-button" id="selection-ai" type="button">AI</button>
            <button class="text-button danger" id="selection-delete" type="button">删除</button>
            <button class="text-button" id="selection-exit" type="button">取消</button>
          </div>
          <div class="draft-context" id="draft-context" hidden></div>
          <form class="composer" id="composer">
            <input type="file" id="pick-files" multiple hidden>
            <button type="button" id="add-files" class="round-button" aria-label="添加图片或文件"><svg class="icon"><use href="#i-plus"/></svg></button>
            <button type="button" id="record-voice" class="round-button" aria-label="录音"><svg class="icon"><use href="#i-mic"/></svg></button>
            <textarea id="draft" rows="1" maxlength="12000" placeholder="写点什么…" aria-label="记录内容"></textarea>
            <button id="send" class="send" type="submit" title="保存记录" aria-label="保存记录" disabled>
              <svg class="icon"><use href="#i-send"/></svg>
            </button>
          </form>
          <p class="status"><span id="status-dot" class="status-dot"></span><span id="status" role="status">本机记录</span><button type="button" class="text-button" id="undo-delete" hidden>撤销删除</button></p>
        </div>
      </div>
    </main>
  </div>

  <dialog id="connection" class="dialog" aria-labelledby="connection-title">
    <div class="dialog-head">
      <span class="dialog-icon"><svg class="icon"><use href="#i-cloud"/></svg></span>
      <button type="button" class="round-button" data-close aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <h2 id="connection-title">连接我的记录</h2>
    <form id="login" novalidate>
      <p>使用手机上一隅的同步邮箱和密码。</p>
      <label>邮箱<input name="email" type="email" placeholder="name@example.com" required autocomplete="username" maxlength="254"></label>
      <label>密码<input name="password" type="password" placeholder="输入同步账号的密码" required autocomplete="current-password" maxlength="1024"></label>
      <p id="login-error" class="feedback" role="alert" hidden></p>
      <div class="login-actions">
        <button type="submit" class="primary" id="login-submit">登录并同步</button>
        <button type="submit" class="secondary" id="register-submit">注册账号</button>
      </div>
      <details id="custom-project" class="custom-project">
        <summary>使用自定义项目</summary>
        <label>项目地址<input name="project" type="text" inputmode="url" autocapitalize="off" placeholder="项目 URL 或完整 Data API 地址" spellcheck="false" maxlength="512"></label>
        <label>项目公钥<input name="key" type="text" placeholder="Publishable key 或 anon key" spellcheck="false" autocomplete="off" maxlength="2048"></label>
      </details>
    </form>
    <div id="connected" hidden>
      <p id="connected-email"></p>
      <p class="account-note" id="connection-info"></p>
      <button type="button" id="logout" class="secondary">退出登录</button>
    </div>
  </dialog>

  <dialog id="attachment-preview" class="dialog attachment-dialog" aria-labelledby="attachment-title">
    <div class="dialog-head">
      <h2 id="attachment-title"></h2>
      <button type="button" class="round-button" data-close aria-label="关闭附件预览"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="attachment-content" class="attachment-content" aria-live="polite"></div>
  </dialog>

  <dialog id="actions" class="dialog record-dialog" aria-labelledby="actions-title">
    <div class="dialog-head"><h2 id="actions-title">记录操作</h2>
      <button type="button" class="round-button" data-close aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="action-choices" class="action-choices">
      <button type="button" class="secondary" id="edit">编辑正文</button>
      <button type="button" class="secondary" id="quote">引用</button>
      <button type="button" class="secondary" id="relation">关联记录</button>
      <button type="button" class="secondary" id="pin">置顶</button>
      <button type="button" class="secondary" id="favorite-group">收藏分组</button>
      <button type="button" class="secondary" id="copy-record">复制正文</button>
      <button type="button" class="secondary" id="share-record">分享</button>
      <button type="button" class="secondary" id="remind-record">提醒我</button>
      <button type="button" class="secondary" id="record-info">记录详情</button>
      <button type="button" class="secondary" id="select-record">多选</button>
      <button type="button" class="secondary danger" id="delete">删除记录</button>
    </div>
    <form id="edit-form" hidden>
      <label>记录内容<textarea id="edit-field" rows="5" maxlength="12000"></textarea></label>
      <button class="primary" type="submit">保存修改</button>
    </form>
    <form id="action-form" hidden></form>
    <div id="delete-confirm" hidden>
      <p id="delete-detail">删除的记录可以在本机的「最近删除」里恢复。</p>
      <button class="primary destructive" type="button" id="confirm-delete">确认删除</button>
    </div>
  </dialog>
  <dialog id="settings" class="dialog" aria-labelledby="settings-title">
    <div class="dialog-head"><h2 id="settings-title">设置</h2>
      <button type="button" class="round-button" data-close aria-label="关闭设置"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="action-choices">
      <label>外观<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <button type="button" class="secondary" id="trash-open">最近删除</button>
      <button type="button" class="secondary" id="reminders-open">记录提醒</button>
      <button type="button" class="secondary" id="backup-open">备份与恢复</button>
      <button type="button" class="secondary" id="ai-open">AI 服务</button>
      <button type="button" class="secondary" id="about-open">关于一隅</button>
    </div>
  </dialog>
  <dialog id="utility" class="dialog attachment-dialog" aria-labelledby="utility-title">
    <div class="dialog-head"><h2 id="utility-title"></h2>
      <button type="button" class="round-button" data-close aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="utility-content"></div>
  </dialog>
  <noscript>请启用 JavaScript 后打开一隅。</noscript>
</body>
</html>
